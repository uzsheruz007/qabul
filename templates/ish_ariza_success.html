{% extends "index.html" %}
{% load static %}

{% block content %}
<style>
.success-wrap {
    min-height: 60vh;
    display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; padding: 80px 16px;
}
.success-card {
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 40px rgba(15,23,42,.1);
    padding: 56px 48px; text-align: center; max-width: 520px; width: 100%;
}
.success-icon {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg,#0a3d6d,#1d4ed8);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px; font-size: 2rem; color: #fff;
}
.success-card h2 { color: #0a3d6d; font-weight: 800; margin-bottom: 12px; }
.success-card p  { color: #64748b; font-size: 1rem; margin-bottom: 8px; }
.back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg,#0a3d6d,#1d4ed8);
    color: #fff; padding: 12px 32px; border-radius: 12px;
    text-decoration: none; font-weight: 600; margin-top: 24px;
    transition: opacity .2s;
}
.back-btn:hover { opacity: .9; color: #fff; }
</style>

<div class="success-wrap">
    <div class="success-card">
        <div class="success-icon"><i class="fas fa-check"></i></div>
        <h2>Ariza muvaffaqiyatli yuborildi!</h2>
        <p>Hurmatli abituriyent, arizangiz qabul qilindi.</p>
        <p>Tez orada aloqaga chiqamiz. <strong>Rahmat!</strong></p>
        <a href="{% url 'home' %}" class="back-btn">
            <i class="fas fa-home"></i> Bosh sahifaga qaytish
        </a>
    </div>
</div>

{% endblock %}
